<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask AI</title>
    <style>
        :root { --bg: #1f1f1f; --panel: #2a2a2a; --text: #ececec; --muted: #9a9a9a; --accent: #6ea8fe; --border: #3d3d3d; --danger: #f28b82; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Segoe UI", sans-serif; }
        body { display: flex; flex-direction: column; padding: 12px 16px; gap: 10px; -webkit-app-region: no-drag; }
        header { display: flex; align-items: center; gap: 8px; -webkit-app-region: drag; user-select: none; }
        header .game { color: var(--muted); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        button, select, textarea { -webkit-app-region: no-drag; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
        button { padding: 4px 10px; cursor: pointer; }
        button:hover:not(:disabled) { border-color: var(--accent); }
        button:disabled { opacity: .5; cursor: default; }
        .icon { padding: 2px 9px; }
        #line { font-size: 22px; line-height: 1.7; padding: 10px 12px; background: var(--panel); border-radius: 8px; user-select: text; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30%; overflow: auto; }
        #line.empty { font-size: 15px; color: var(--muted); }
        .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        textarea { width: 100%; resize: none; padding: 8px 10px; }
        #thread { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
        .q { color: var(--muted); font-weight: 600; white-space: pre-wrap; }
        .a { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
        #status { color: var(--muted); font-size: 13px; min-height: 1.2em; }
        #status.error { color: var(--danger); }
        .hint { color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <span class="game" id="game"></span>
        <button class="icon" id="prevBtn" title="Previous line (PageUp)">◀</button>
        <span class="hint" id="position"></span>
        <button class="icon" id="nextBtn" title="Next line (PageDown)">▶</button>
        <button class="icon" id="closeBtn" title="Close (Esc)">✕</button>
    </header>

    <div id="line" lang="ja"></div>

    <div class="row">
        <button data-mode="sentence">Break down</button>
        <button data-mode="grammar">Grammar</button>
        <button data-mode="vocabulary">Vocabulary</button>
        <button data-mode="nuance">Nuance</button>
        <button data-mode="context">Scene</button>
        <select id="context" title="How much surrounding dialogue the AI sees">
            <option value="default">Default context</option>
            <option value="25">±25 lines</option>
            <option value="-1">Whole session</option>
        </select>
        <button id="newThreadBtn" title="Forget the conversation about this line">New thread</button>
    </div>

    <textarea id="question" rows="2" lang="ja" placeholder="Ask anything about this line, e.g. この「は」はなぜ？  (Enter sends, Shift+Enter new line)"></textarea>
    <div id="status"></div>
    <div id="thread" aria-live="polite"></div>
    <div class="hint">Esc closes · PageUp/PageDown change line · answers are selectable, so Yomitan works on them</div>

    <script src="/static/js/ask.js"></script>
</body>
</html>
